version: "3"
services:
    bot:
        build: .
        image: witchbot
        restart: always
        volumes:
            - ./config:/app/config

    embedserver:
        build: ./embedserver
        image: embedserver
        restart: always

    nginx:
        image: nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
            - certbot-certs:/etc/letsencrypt
            - certbot-webroot:/var/www/certbot

    certbot:
        image: certbot/certbot
        volumes:
            - certbot-certs:/etc/letsencrypt
            - certbot-webroot:/var/www/certbot


volumes:
    certbot-certs:
    certbot-webroot: