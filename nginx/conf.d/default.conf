server {
    listen 80;
    server_name witchbot.net www.witchbot.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name witchbot.net www.witchbot.net;

    ssl_certificate /etc/letsencrypt/live/witchbot.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witchbot.net/privkey.pem;

    location / {
        proxy_pass http://embedserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}